name: OpenClaw Release PR

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get current and latest OpenClaw versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          current_version=$(node -e 'const fs = require("fs"); const match = fs.readFileSync("Dockerfile", "utf8").match(/npm install -g openclaw@([^\s\\]+)/); if (!match) process.exit(1); process.stdout.write(match[1]);')
          latest_version=$(npm view openclaw@latest version)

          echo "current_version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "latest_version=${latest_version}" >> "$GITHUB_OUTPUT"

          if [[ "${current_version}" == "${latest_version}" ]]; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Dockerfile OpenClaw version
        if: steps.versions.outputs.update_needed == 'true'
        shell: bash
        env:
          LATEST_OPENCLAW_VERSION: ${{ steps.versions.outputs.latest_version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = "Dockerfile";
          const version = process.env.LATEST_OPENCLAW_VERSION;
          const source = fs.readFileSync(path, "utf8");
          const pattern = /(npm install -g openclaw@)[^\s\\]+/;

          if (!version || !pattern.test(source)) {
            throw new Error("Unable to update the pinned OpenClaw version");
          }

          fs.writeFileSync(path, source.replace(pattern, (_, prefix) => `${prefix}${version}`));
          NODE

      - name: Create or update pull request
        if: steps.versions.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/openclaw-update-${{ steps.versions.outputs.latest_version }}
          delete-branch: true
          commit-message: "chore: bump openclaw to ${{ steps.versions.outputs.latest_version }}"
          title: "chore: bump openclaw to ${{ steps.versions.outputs.latest_version }}"
          body: |
            Automated update for OpenClaw.

            - Current version: `${{ steps.versions.outputs.current_version }}`
            - Latest npm version: `${{ steps.versions.outputs.latest_version }}`

            After this PR is merged, a separate workflow tags the merge commit with `${{ steps.versions.outputs.latest_version }}` to trigger container build.
          labels: |
            openclaw-update
