name: OpenClaw upgrade compatibility

on:
  pull_request:
    paths:
      - Dockerfile
      - server.cjs
      - onboard.cjs
      - bin/**
      - package*.json
      - openclaw-context/**
      - test/**
      - .github/workflows/migration-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recent-upgrades:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Install wrapper test dependencies
        run: npm ci
      - name: Wrapper unit tests
        run: npm test
      - name: Verify recent Store upgrades and fresh installation
        id: upgrades
        run: npm run test:upgrades
      - name: Preserve upgrade results and container logs
        if: always() && steps.upgrades.outputs.report-dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-evidence-${{ matrix.runner }}
          path: ${{ steps.upgrades.outputs.report-dir }}
          include-hidden-files: true
          retention-days: 14
